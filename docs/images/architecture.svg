<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img"><title>Johnny Be Good · Evaluation architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677b"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173047}.head{font-size:38px;font-weight:700}.sub{font-size:23px;fill:#536b7c}.title{font-size:27px;font-weight:700}.body{font-size:22px;fill:#486275}.label{font-size:21px;fill:#486275}.edge{fill:none;stroke:#52677b;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1800" height="1140" fill="#f5f8fa"/><text class="head" x="70" y="65">Johnny Be Good · Evaluation architecture</text><text class="sub" x="70" y="108">Test definitions + recorded evidence + explicit grading → inspectable results</text><rect x="70" y="200" width="440" height="190" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="70" y="200" width="440" height="8" rx="4" fill="#4f866e"/><text class="title" x="95" y="248">Test suite</text><text class="body" x="95" y="290">Tasks + exact expectations</text><text class="body" x="95" y="323">Rubrics + adapter/judge config</text><rect x="650" y="200" width="480" height="190" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="650" y="200" width="480" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="675" y="248">Acquire application evidence</text><text class="body" x="675" y="290">score: read saved traces</text><text class="body" x="675" y="323">run: invoke a command adapter</text><rect x="1270" y="200" width="460" height="190" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="1270" y="200" width="460" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="1295" y="248">Your app / saved runs</text><text class="body" x="1295" y="290">Actual answers + recorded steps</text><text class="body" x="1295" y="323">Tokens/cost when instrumented</text><path class="edge" d="M510 295H650"/><path class="edge" d="M1130 295H1270"/><text class="label" x="1160" y="275">Call / load</text><path class="edge" d="M1270 345H1130"/><text class="label" x="1157" y="378">Evidence</text><rect x="650" y="470" width="480" height="145" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="650" y="470" width="480" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="675" y="518">Normalized trace</text><text class="body" x="675" y="560">One common schema for all graders</text><rect x="1260" y="470" width="470" height="190" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="1260" y="470" width="470" height="8" rx="4" fill="#987642"/><text class="title" x="1285" y="518">Opt-in artifact directory</text><text class="body" x="1285" y="560">Traces · report · suite · manifest</text><text class="body" x="1285" y="593">Checksums + explicit configuration</text><text class="body" x="1285" y="626">Replay without app calls</text><path class="edge" d="M1130 535H1260"/><text class="label" x="1148" y="514">Archive</text><path class="edge" d="M890 390V470"/><text class="label" x="915" y="437">Validate</text><rect x="150" y="705" width="600" height="150" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="150" y="705" width="600" height="8" rx="4" fill="#4f866e"/><text class="title" x="175" y="753">Exact checks</text><text class="body" x="175" y="795">Tool use, arguments, budgets, final matcher</text><rect x="1020" y="705" width="650" height="150" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="1020" y="705" width="650" height="8" rx="4" fill="#987642"/><text class="title" x="1045" y="753">Optional judge cascade</text><text class="body" x="1045" y="795">Jev → configured LLM for unresolved rubrics</text><path class="edge" d="M770 615V660H450V705"/><path class="edge" d="M1010 615V680H1340V705"/><rect x="610" y="920" width="600" height="125" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="610" y="920" width="600" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="635" y="968">Report + saved result</text><text class="body" x="635" y="1010">Pass / fail / unjudged / error</text><path class="edge" d="M450 855V982H610"/><path class="edge" d="M1340 855V982H1210"/><path class="edge" d="M1210 1015H1765V565H1730"/><text class="label" x="75" y="1090">No hosted dashboard required · Remote judges can receive trace content · A score is only as good as its evidence and grading criteria</text></svg>