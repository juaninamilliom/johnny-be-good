<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img"><title>Johnny Be Good · Connect an application</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677b"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173047}.head{font-size:38px;font-weight:700}.sub{font-size:23px;fill:#536b7c}.title{font-size:27px;font-weight:700}.body{font-size:22px;fill:#486275}.label{font-size:21px;fill:#486275}.edge{fill:none;stroke:#52677b;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1800" height="1140" fill="#f5f8fa"/><text class="head" x="70" y="65">Johnny Be Good · Connect an application</text><text class="sub" x="70" y="108">An external bridge lets the evaluator call your existing feature</text><rect x="70" y="220" width="460" height="175" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="70" y="220" width="460" height="8" rx="4" fill="#4f866e"/><text class="title" x="95" y="268">Suite + test input</text><text class="body" x="95" y="310">Representative question</text><text class="body" x="95" y="343">Expected outcome or rubric</text><rect x="690" y="220" width="440" height="175" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="690" y="220" width="440" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="715" y="268">Terminal runner</text><text class="body" x="715" y="310">Launch adapter once per trial</text><text class="body" x="715" y="343">Collect and grade the trace</text><path class="edge" d="M530 305H690"/><rect x="690" y="500" width="440" height="180" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="690" y="500" width="440" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="715" y="548">Your adapter script</text><text class="body" x="715" y="590">Map task to the API request</text><text class="body" x="715" y="623">Map response to native JSON</text><path class="edge" d="M910 395V500"/><text class="label" x="950" y="452">Task on stdin / environment</text><rect x="1290" y="500" width="440" height="180" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="1290" y="500" width="440" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="1315" y="548">Your existing app</text><text class="body" x="1315" y="590">HTTP endpoint or function</text><text class="body" x="1315" y="623">No evaluator SDK required</text><path class="edge" d="M1130 560H1290"/><text class="label" x="1165" y="542">Request</text><path class="edge" d="M1290 630H1130"/><text class="label" x="1150" y="660">Response</text><rect x="70" y="500" width="460" height="180" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="70" y="500" width="460" height="8" rx="4" fill="#987642"/><text class="title" x="95" y="548">Instrumentation boundary</text><text class="body" x="95" y="590">Only record what the app exposes</text><text class="body" x="95" y="623">Never invent hidden tool calls</text><path class="edge" d="M530 590H690"/><text class="label" x="558" y="570">Evidence</text><rect x="690" y="820" width="440" height="170" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="690" y="820" width="440" height="8" rx="4" fill="#4f7e9d"/><text class="title" x="715" y="868">Native trace → report</text><text class="body" x="715" y="910">Actual answer + recorded evidence</text><text class="body" x="715" y="943">Assertions + judge verdicts</text><path class="edge" d="M910 680V820"/><text class="label" x="955" y="758">JSON on stdout · logs on stderr</text><rect x="1290" y="820" width="440" height="170" rx="20" fill="#fff" stroke="#b9cbd6" stroke-width="2"/><rect x="1290" y="820" width="440" height="8" rx="4" fill="#4f866e"/><text class="title" x="1315" y="868">Saved-response alternative</text><text class="body" x="1315" y="910">Export native trace JSON</text><text class="body" x="1315" y="943">Use score; no app call needed</text><path class="edge" d="M1290 905H1130"/><text class="label" x="70" y="1062">The example HTTP contract is adaptable—not automatic integration with every API, stream, framework or authentication scheme.</text></svg>